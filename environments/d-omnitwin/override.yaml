# Our changes to D-OmniTwin's docker-compose.yml and docker-compose.images.yml
# (v0.6.1), kept apart from its files. Applied as a third -f file. Each change
# and why:
#
#   image: ...@sha256:...   pinned by digest (AGENTS rule 4); the tags are
#                           upstream's own for v0.6.1
#   pull_policy: missing    images.yml says "always"; a second start works
#                           without the internet
#
# The project (d-omnitwin-launch) and the port (18797) come from run.sh, so a
# D-OmniTwin of its own on this computer keeps its containers and volumes.
#
# SPDX-License-Identifier: EUPL-1.2
