# Our changes to upstream's gzac-docker-compose (v/13; profiles demo, zgw and
# openformulieren), kept
# apart from its files (#246). Applied as a second -f file. Each change and why:
#
#   image: ...@sha256:...   pinned by digest (AGENTS rule 4); the tags are
#                           upstream's own, the digests are in the manifest
#   mem_limit, JAVA_*       the guest has 16 GiB; without a limit each JVM
#                           sizes itself from the whole guest
#   extra_hosts             upstream reaches the database and Keycloak through
#                           host.docker.internal; on Linux Docker Engine that
#                           name needs host-gateway (Docker Desktop has it)
#
# Nothing else differs from upstream: realm, users, ports, the demo case and
# the ZGW and Open Formulieren fixtures are upstream's. (The driver adds the
# login launcher / launcher and Open Formulieren's address to the realm's console
# client after start: apps/valtimo/deploy.sh add_dawo_login.)

services:
  gzac-keycloak:
    image: quay.io/keycloak/keycloak:26.2.2@sha256:df40860c716d0c2f941967e8ac3ca5e74094c09988298b2eb0ae9335ed34f8f6
    mem_limit: 1g
    environment:
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"

  gzac-keycloak-database:
    image: docker.io/library/postgres:17.4@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    mem_limit: 512m

  gzac-database:
    image: docker.io/library/postgres:17.4@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    mem_limit: 512m

  gzac-rabbitmq:
    image: docker.io/library/rabbitmq:4.1-management@sha256:b99311e4919b76a723111339950d9a15dc1e9daff2c0320b18b6c18f961a7ee3
    mem_limit: 512m

  gzac-demo-backend:
    image: docker.io/ritense/gzac-evenementenvergunning-demo-backend:13.4.1@sha256:595cf859ef31dc07e8828b1a20308c8d7756922edeedd0aa6d6aaf5e9967a7bd
    mem_limit: 3g
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
    extra_hosts:
      - "host.docker.internal:host-gateway"

  gzac-demo-frontend:
    image: docker.io/ritense/gzac-evenementenvergunning-demo-frontend:13.4.1@sha256:2725cc40ae5ac143edef212a7bce72db87e61c2f846b4e645f1f0abde4bf29c9
    mem_limit: 256m

  # The ZGW services and Open Formulieren (#260): upstream's profiles zgw and
  # openformulieren, as its README combines them with demo. Pinned, with a
  # memory limit; the web services run 2 uWSGI processes instead of 4 and
  # Open Notificaties' worker 1 task at a time instead of 4 (memory); the
  # health checks others wait for allow 10 minutes for the first migrations
  # (upstream: 30 s start, then 3 tries of 30 s); and the services that call
  # each other through host.docker.internal get host-gateway (see above).

  openzaak:
    image: docker.io/openzaak/open-zaak:1.25.0@sha256:79a78bc78419670c8695ac5ba16b0af5e7a6a67d3ecbfe5b9095ded2aba177eb
    mem_limit: 1g
    environment:
      - UWSGI_PROCESSES=2
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openzaak-database:
    image: docker.io/postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
    mem_limit: 512m

  openzaak-redis:
    image: docker.io/library/redis:8.2.2@sha256:4521b581dbddea6e7d81f8fe95ede93f5648aaa66a9dacd581611bf6fe7527bd
    mem_limit: 128m

  objecten-api:
    image: docker.io/maykinmedia/objects-api:3.3.0@sha256:882f384035ba00de7c9f405c692497182b8a49491638a9e935cf609746fd067b
    mem_limit: 1g
    environment:
      - UWSGI_PROCESSES=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      start_period: 600s

  objecten-api-database:
