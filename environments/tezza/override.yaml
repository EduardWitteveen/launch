# Our changes to Contezza's tezza-packaging (4.15.2, docker-compose.yml), kept
# apart from its files (#261). Applied as a second -f file. The product as
# Contezza ships it, every service (the maintainer, 24 October: "gewoon out of
# the box", "zo veel mogelijk als het originele product"), with only these
# changes, each with its reason:
#
#   image: ...@sha256:...   pinned by digest (AGENTS rule 4); the tags are
#                           upstream's own, the digests are in the manifest
#   redis 8.2.2             instead of upstream's redis:7 (7.4 is RSALv2/SSPL
#                           only; 8.x adds AGPLv3, #273), as in Valtimo
#   SPRING_PROFILES_ACTIVE  upstream's gzac-backend stops at start: its case
#     (gzac-backend)        definition destructionProcedureDossier is a draft,
#                           which needs a dev profile ("This Valtimo
#                           environment does not support drafts"); without it
#                           Tezza cannot register cases. The dev profile also
#                           moves its port to 9092: SERVER_PORT keeps upstream's
#                           8080, where the apps proxy /gzac/ ('Mijn taken')
#   LDAP_REMOVE_CONFIG_...  osixia/openldap deletes its bootstrap directory
#     (openldap)            after the first start, and every later start fails
#                           copying the seed there: the image's own switch
#   restart: on-failure     Open Zaak's start script stops at its first error
#     (openzaak, -celery,   and upstream has no restart policy (it never
#     app-tezza, -admin)    answered on the Dell run of 23 October); the apps'
#                           nginx stops for good when an upstream host is not
#                           up yet
#   depends_on              the Admin Tools wait for authorization-profiles
#     (app-tezza-admin)
#   dawo.users.json         upstream's default.users.json with launcher in
#     (authorization-       every profile that has admin: the roles in GZAC
#     profiles)             (ROLE_USER, ...) come from these profiles, and
#                           without them 'Mijn taken' answers 403
#
# Left out (deploy.sh starts the services by name): app-tezza-akten, which
# does not start in upstream's setup either (its nginx does not find
# alfresco.local). Nothing else differs from upstream.

services:
  app-tezza:
    image: harbor.contezza.nl/public/apps/tezza:4.15.2@sha256:fee07a13aac04eee3e524c30971cb58d5844b52a7eaf78807148549fd3a3fc96
    restart: on-failure

  app-tezza-admin:
    image: harbor.contezza.nl/public/apps/tezza-admin:4.15.2@sha256:f0284030e86bbe80f5ad7429328940a701dad10d726f3340947c650fc5c18091
    depends_on: !override
      - platform
      - authorization-profiles
    restart: on-failure

  app-tezza-reports:
    image: harbor.contezza.nl/public/apps/tezza-reports:4.15.2@sha256:18884c74ad4865a35b1eb9ab62b3047c700645bfad88e51733a03110ded88137

  app-tezza-rm:
    image: harbor.contezza.nl/public/apps/tezza-rm:4.15.2@sha256:cce11b7701490890376a82c576f72ae1d6b19853d839d4524fba2b1dc1ab25ce

  authorization-profiles:
    image: harbor.contezza.nl/public/contezza-authorization-profiles:1.1.0@sha256:57fd3febedb3badd3432a4f7260abded277dee0f871a0953b3413b78b2c3f097
    volumes:
      # Upstream's users of the profiles plus launcher wherever admin is
      # (deploy.sh writes it next to upstream's file before compose up).
      - ./resources/ap/dawo.users.json:/app/default.users.json

  authorization-profiles-db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929

  gzac-backend:
    image: harbor.contezza.nl/public/tezza-gzac-backend:4.15.2@sha256:49c49df627e7c5456ffc59999b8155566ba59d2ceb114f6d7568e8e92868c2b6
    environment:
      SPRING_PROFILES_ACTIVE: "localhost,dev"
      SERVER_PORT: "8080"

  gzac-db:
