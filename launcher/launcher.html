<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<!-- The Launcher (ADR 0008). Served by launcher.py, which fills in the token.
     Experimental and unofficial. SPDX-License-Identifier: EUPL-1.2 -->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2733; --muted: #5b6875;
    --line: #dde3ea; --accent: #1f5fbf; --accent-text: #ffffff;
    --ok: #1b7f3b; --busy: #a86200; --warn-bg: #fff6e5; --warn: #7a4a00;
    --bad-bg: #fdecea; --bad: #8e0000; --ok-bg: #e8f5ec;
    --veil: rgba(244, 246, 248, .72);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --card: #1b222b; --text: #e6ebf0; --muted: #9aa7b4;
      --line: #2c3743; --accent: #6aa5ff; --accent-text: #0d1117;
      --ok: #5fd08a; --busy: #f0b35a; --warn-bg: #2d2416; --warn: #f0c27a;
      --bad-bg: #3a1c1c; --bad: #ffb4ab; --ok-bg: #16301f;
      --veil: rgba(18, 23, 29, .72);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card.blocked, .cycle.blocked { opacity: .5; }
  /* GEEN LAUNCHER (§3.12): a yellow bar, the rest grey and without buttons. */
  .offline { position: sticky; top: 0; z-index: 20; margin: 0; padding: 10px 20px; text-align: center;
             background: #fff3cd; color: #5c4400; font-weight: 600; }
  body.dead main { opacity: .5; }
  body.dead main button, body.dead main .auto button { display: none; }
  body.dead main a { pointer-events: none; }
  /* What went wrong with a click (rule 7), and T1. */
  .topmsg { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 14px;
            margin: 0 0 20px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .topmsg button { font-size: .85rem; padding: 4px 10px; color: inherit; border-color: currentColor; }
  .twoactive { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px;
               margin: 0 0 20px; font-weight: 600; }
  /* Rule 7: after a click the page greys, with what happens in the middle. */
  .overlay { position: fixed; inset: 0; z-index: 10; background: var(--veil); display: grid; place-items: center; }
  .overlay[hidden], .offline[hidden] { display: none; }
  .overlay p { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 22px;
               font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.12); display: flex; gap: 10px; align-items: center; margin: 0 16px; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
          animation: spin 1s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .round-note { font-size: .9rem; color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; gap: 14px; align-items: center; }
  .logo { width: 48px; height: 48px; border-radius: 10px; background: var(--accent);
          color: var(--accent-text); display: grid; place-items: center;
          font-weight: 700; font-size: 1.4rem; flex: none; }
  .title { font-weight: 650; font-size: 1.15rem; margin: 0; }
  .version { color: var(--muted); font-size: .85rem; }
  .summary { margin: 0; color: var(--text); }
  .state { font-size: .95rem; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .state.ready .dot { background: var(--ok); }
  .state.starting .dot, .state.busy .dot { background: var(--busy); animation: pulse 1.2s infinite; }
  .state.failed .dot, .state.problem .dot { background: #c62828; }
  .state.attention .dot { background: #d9a400; }
  @keyframes pulse { 50% { opacity: .3; } }
  .text { margin: 0; font-size: .95rem; }
  .muted { color: var(--muted); font-size: .9rem; margin: 0; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px;
          padding: 10px 12px; font-size: .9rem; }
  .warn p { margin: 0; }
  .warn p + p { margin-top: 6px; }
  .bad { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
  .bad p { margin: 0; }
  .bad p + p { margin-top: 6px; }
  .note { font-size: .9rem; font-weight: 600; margin: 0; }
  .note.good { color: var(--ok); }
  .note.bad-note { color: var(--bad); }
  .fixbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
  .fixbox p { margin: 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
  button, a.button { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px;
          border: 1px solid var(--line); background: transparent; color: var(--text);
          cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a.button:focus-visible, .parts a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
  /* The parts of a running environment (3B): the main one on top. */
  .parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
  .parts li { display: flex; flex-direction: column; }
  .parts li.main a { align-self: flex-start; }
  .parts a { color: var(--accent); font-weight: 600; }
  .parts a.primary { color: var(--accent-text); }
  .parts .plogin { color: var(--muted); font-size: .85rem; }
  .parts-head { font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
  .log summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  /* Aanpassen (1C6) and what differs from the defaults (1C7). */
  .custom { margin: 0; font-size: .9rem; color: var(--muted); }
  .custom b { color: var(--text); font-weight: 600; }
  .options { font-size: .9rem; }
  .options > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .opt-head { margin: 10px 0 4px; font-weight: 600; font-size: .85rem; color: var(--muted); }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .opt input { margin: 3px 0 0; flex: none; width: 16px; height: 16px; accent-color: var(--accent); cursor: inherit; }
  .opt span { display: flex; flex-direction: column; }
  .opt small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
  .opt.off { cursor: default; opacity: .55; }
  body.dead main input { pointer-events: none; }
  .log pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
             font-size: .75rem; line-height: 1.4; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Progress while an environment starts (#232): the whole start on top,
     the current step below. */
  .progress { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
  .prow { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  .prow b { color: var(--text); font-weight: 600; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar.step { height: 6px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: inherit;
               transition: width .8s linear; }
  .bar.step > div { background: var(--busy); }
  .bar.waiting > div { width: 35% !important; animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .plabel { font-weight: 600; margin-top: 4px; }
  .ptime { color: var(--muted); font-size: .85rem; }
  .peta { color: var(--muted); font-size: .85rem; }
  .pdetail { color: var(--muted); font-size: .8rem; font-style: italic; overflow-wrap: anywhere; }
  .auto { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--warn-bg);
          color: var(--warn); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
  .auto button { font-size: .85rem; padding: 6px 12px; }
  .cycle { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px;
           margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; font-size: .95rem; }
  .cycle.active { border-color: var(--accent); }
  .cycle-last { margin: 0; padding-left: 18px; color: var(--muted); font-size: .85rem; }
  .notice { border: 1px solid #d9a400; background: #fff8e0; color: #3d3000; border-radius: 10px; padding: 10px 12px; }
  .notice.danger { border: 2px solid #c62828; background: #fdecea; color: #8e0000; }
  .notice.danger b { color: #b71c1c; }
  .notice-text { white-space: pre-wrap; font-size: .9rem; margin: 6px 0 0; }
  @media (prefers-color-scheme: dark) {
    .notice { background: #2d2416; color: #f0d9a8; }
    .notice.danger { background: #3a1c1c; color: #ffb4ab; }
    .notice.danger b { color: #ffb4ab; }
  }
  .licences { font-size: .85rem; margin: 0; }
  .licences summary { cursor: pointer; }
  .licences ul { margin: 6px 0 0; padding-left: 18px; }
  .lic-green > summary::before, .lic-yellow > summary::before, .lic-red > summary::before,
  .lic-green.folded::before, .lic-yellow.folded::before, .lic-red.folded::before { content: "● "; }
  .lic-green > summary::before, .lic-green.folded::before { color: #2e7d32; }
  .lic-yellow > summary::before, .lic-yellow.folded::before { color: #b58900; }
  .lic-red > summary::before, .lic-red.folded::before { color: #c62828; }
  .lic-reason, .lic-count { margin: 6px 0; }
  .lic-sub { margin: 4px 0 0 12px; }
  .lic-sub > summary { color: var(--accent); }
  .lic-item { list-style: none; margin-left: -18px; }
  .lic-item::before { content: "● "; }
  .lic-item.lic-open::before { color: #2e7d32; }
  .lic-item.lic-restricted::before, .lic-item.lic-unknown::before { color: #b58900; }
  .lic-item.lic-closed::before { color: #c62828; }
  .lic-item.lic-closed { font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .bar > div { transition: none; }
    .bar.waiting > div { animation: none; width: 100% !important; opacity: .4; }
    .spin, .state .dot { animation: none !important; }
  }
</style>
</head>
<body>
<p id="offline" class="offline" hidden></p>
<main>
  <h1>Launcher</h1>
  <p class="lead">Kies een omgeving, start hem, gebruik hem en stop hem weer; de eerste keer duurt starten lang, omdat alles dan wordt gedownload.</p>
  <div id="top"></div>
  <div id="cycle"></div>
  <div class="grid" id="grid" aria-live="polite"></div>
  <footer>Experimenteel en onofficieel. Er draait één omgeving tegelijk.</footer>
</main>
<div id="overlay" class="overlay" hidden><p><span class="spin" aria-hidden="true"></span><span id="overlay-text"></span></p></div>
<script>
"use strict";
// The page draws only what the Launcher says (docs/launcher-behaviour.md,
// rule 8): GET /api/state every 2 s, redrawn when its seq changes. No guess
// of its own about what a click did; until the server answers, the page is
// grey (rule 7).
const TOKEN = "__LAUNCHER_TOKEN__";
const POPUP = "popup,width=1400,height=900";
const OPEN_KEY = "launcher-open";   // the env this tab started (contract G)

let S = null;            // the last state
let skew = 0;            // server clock minus ours, in seconds
let lastAnswer = 0;      // when the Launcher last answered (our clock)
const pageLoaded = Date.now() / 1000;
let overlay = null;      // {seq, at}: grey until the seq changes
let topMessage = "";     // what went wrong with the last click
let heldBack = null;     // the env whose window the browser held back (3B)
let topMessageAt = 0;

const nowLocal = () => Date.now() / 1000;
const serverNow = () => nowLocal() + skew;

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) if (c != null && c !== false) e.append(c);
  return e;
}

// "1 min 20 s", "7 min", "45 s"
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + " s";
  const m = Math.floor(s / 60), r = s % 60;
  return m < 10 && r ? `${m} min ${r} s` : `${Math.round(s / 60)} min`;
}

function clock(t) {
  return new Date(t * 1000).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}

// BEGIN actions
// Rule 7: grey at once, with what happens, until the next state is there.
// Not possible now (409) or no answer: the page as it was, and why on top.
async function post(path, sentence) {
  if (overlay) return;
  topMessage = "";
  showOverlay(sentence);
  let msg = "";
  try {
    const r = await fetch(path, { method: "POST", headers: { "X-Launcher-Token": TOKEN } });
    let j = {};
    try { j = await r.json(); } catch (e) { /* no JSON */ }
    if (!r.ok || !j.ok) msg = j.message || "Dat lukte nu niet.";
  } catch (e) {
    msg = "De Launcher antwoordt niet. Probeer het zo opnieuw.";
  }
  if (msg) {
    hideOverlay();
    topMessage = msg;
    topMessageAt = nowLocal();
    render();
    return false;
  }
  refresh();
  return true;
}

function hideOverlay() {
  overlay = null;
  document.getElementById("overlay").hidden = true;
}

function showOverlay(sentence) {
  overlay = { seq: S ? S.seq : null, at: nowLocal() };
  document.getElementById("overlay-text").textContent = sentence;
  document.getElementById("overlay").hidden = false;
}

function act(verb, env) {
  const t = env.title;
  const sentence = {
    start: `${t} wordt gecontroleerd…`,
    retry: env.phase === "stopping" ? `${t} wordt gestopt…` : `${t} wordt opnieuw gecontroleerd…`,
    fix: `Launch lost het op…`,
    accept: `${t} wordt gestart…`,
    stop: `${t} wordt gestopt…`,
  }[verb];
  // The tab that starts opens the main part once it is ready (contract G).
  const starts = verb === "start" || verb === "accept" || (verb === "retry" && env.phase === "problem");
  post(`/api/${verb}/${env.id}`, sentence).then(ok => {
    if (!ok) return;
    try {
      if (starts) sessionStorage.setItem(OPEN_KEY, env.id);
      else if (verb === "stop") sessionStorage.removeItem(OPEN_KEY);
    } catch (e) { /* no storage: nothing opens by itself; 3B is there */ }
  });
}

// Aanpassen (1C6): a choice is a setting, not a phase change, so no grey
// page; the next state shows what the Launcher saved. Not possible now (409)
// or no answer: the message on top and the choices as the Launcher has them.
async function setOption(env, opt, on) {
  let msg = "";
  try {
    const r = await fetch(`/api/options/${env.id}`, {
      method: "POST", headers: { "X-Launcher-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ [opt.id]: on }) });
    let j = {};
    try { j = await r.json(); } catch (e) { /* no JSON */ }
    if (!r.ok || !j.ok) msg = j.message || "Dat lukte nu niet.";
  } catch (e) {
    msg = "De Launcher antwoordt niet. Probeer het zo opnieuw.";
  }
  if (msg) {
    topMessage = msg;
    topMessageAt = nowLocal();
    render();
    return;
  }
  refresh();
}

function cancelAuto() { post("/api/autostart/cancel", "Het automatisch starten wordt uitgezet…"); }

function cycleAct(verb) {
  post(`/api/cycle/${verb}`, { start: "De rondgang wordt gestart…", stop: "De rondgang wordt gestopt…" }[verb] || "Even geduld…");
}

// Every part opens in a window of its own; a click that only opens a
// window greys nothing (rule 7).
function openPart(url) {
  const w = window.open(url, "_blank", POPUP);
  if (w) { try { w.opener = null; } catch (e) { /* cross-origin */ } }
  return w;
}
// END actions

// BEGIN licences
// Licences per repository (#273). Closed, one quiet line with the colour as a
// dot (the maintainer's review of 23 October: the red text shouted, was too
// long, and named the colour twice). Opened: why, the count, and two lists
// that open on their own: the parts (not clearly open source first) and the
// licences used. Only when not everything is open source (1C3, rule 3).
const LIC_CLASS = { closed: "gesloten", restricted: "beperkte licentie", unknown: "geen licentie gevonden", open: "open source" };
const LIC_ORDER = { closed: 0, restricted: 1, unknown: 2, open: 3 };
const LIC_TITLE = { green: "Alles open source", yellow: "Onduidelijke licenties", red: "Niet alles open source" };
function licencesBlock(env) {
  const l = env.licences;
  if (!l || !l.total || l.level === "green") return null;
  // The count per licence: a choice counts as its first, "-only" and
  // "-or-later" together (the list has the full expression).
  const short = {};
  for (const [k, n] of Object.entries(l.counts || {})) {
    const s = k.split(" OR ")[0].replace(/-(only|or-later)$/, "").replace(/^LicenseRef-/, "");
    short[s] = (short[s] || 0) + n;
  }
  const used = Object.entries(short).sort((a, b) => b[1] - a[1]).map(([k, n]) => el("li", {}, `${k}: ${n}`));
  const cls = Object.fromEntries((l.classes || []).map(c => [c.name, c.class]));
  const comps = [...(env.components || [])].sort((a, b) => LIC_ORDER[cls[a.name] || "unknown"] - LIC_ORDER[cls[b.name] || "unknown"]);
  const what = c => {
    const k = cls[c.name] || "unknown";
    if (k === "open") return c.license.replace(/^LicenseRef-/, "");
    if (c.license.startsWith("LicenseRef-proprietary") || c.license === "NOASSERTION") return LIC_CLASS[k];
    return `${LIC_CLASS[k]} (${c.license})`;
  };
  const items = comps.map(c => el("li", { class: "lic-item lic-" + (cls[c.name] || "unknown") },
    el("a", { href: c.repo, target: "_blank", rel: "noopener" }, c.name),
    el("span", {}, " · " + what(c))));
  return el("details", { class: "licences lic-" + l.level },
    el("summary", {}, LIC_TITLE[l.level] || "Licenties"),
    l.reason ? el("p", { class: "lic-reason" }, l.reason) : null,
    el("p", { class: "lic-count" }, `${l.open} van ${l.total} onderdelen open source.`),
    el("details", { class: "lic-sub" }, el("summary", {}, `Onderdelen (${items.length})`), el("ul", {}, ...items)),
    used.length ? el("details", { class: "lic-sub" }, el("summary", {}, `Gebruikte licenties (${used.length})`), el("ul", {}, ...used)) : null);
}
// END licences

// The progress an environment reports while it starts (#232): a bar for the
// whole start and one for the current step. Before the environment reports
// anything, a moving bar says that it is being prepared. The times are
// filled in by tick(), every second, without redrawing the card.
function progressBlock(env) {
  const p = env.progress;
  if (!p) {
    return el("div", { class: "progress" },
      el("div", { class: "prow" }, el("b", {}, "Voorbereiden…")),
      el("div", { class: "bar waiting" }, el("div", {})),
      el("div", { class: "ptime" }, "De omgeving wordt klaargezet; zo meteen zie je de stappen."));
  }
  const box = el("div", { class: "progress", "data-id": env.id, "data-step": p.step, "data-steps": p.steps,
                          "data-started": p.started, "data-since": p.since || "", "data-expected": p.expected || "",
                          "data-rest": p.rest ?? "" },
    el("div", { class: "prow" }, el("b", {}, `Stap ${p.step} van ${p.steps}`), el("span", { class: "psince" }, "")),
    el("div", { class: "bar overall", role: "progressbar", "aria-label": "Totale voortgang" }, el("div", {})),
    el("div", { class: "peta" }, ""),
    el("div", { class: "plabel" }, p.label || ""),
    el("div", { class: "bar step" + (p.expected ? "" : " waiting"), role: "progressbar", "aria-label": "Voortgang van deze stap" }, el("div", {})),
    el("div", { class: "ptime" }, ""),
    el("div", { class: "pdetail" }, ""));
  setDetail(box, p);
  return box;
}

// What the environment does right now (#235, 2E), updated in place.
function setDetail(box, p) {
  box.dataset.activity = p.activity || "";
  box.querySelector(".pdetail").textContent = p.detail ? "Nu: " + p.detail : "";
}

// BEGIN progress texts
// The step's time and the estimate. When it will be ready (#235): what is
// left of this step plus the steps after it, as they went last time on this
// machine. Once the step takes longer than last time there is no estimate:
// it said "nog ongeveer 2 min" for 50 minutes on the Dell (#279). Whether
// something still happens, "laatste activiteit" tells.
function progressTexts(elapsed, exp, rest, now) {
  if (!exp) return { time: `${dur(elapsed)} bezig`, eta: null };
  if (elapsed <= exp * 1.15) {
    const time = `${dur(elapsed)} van ongeveer ${dur(exp)}`;
    if (rest === "" || rest == null) return { time, eta: null };
    const left = Math.max(exp - elapsed, 30) + +rest;
    return { time, eta: `nog ongeveer ${dur(left)} · klaar rond ${clock(now + left)}` };
  }
  return { time: `${dur(elapsed)} bezig; vorige keer duurde deze stap ${dur(exp)}.`,
           eta: rest === "" || rest == null ? null : "duurt langer dan vorige keer; geen schatting" };
}
// END progress texts

// The parts (3B): the main one first, then the links, each with its login.
function partsList(parts, head) {
  if (!parts || !parts.length) return null;
  const list = el("ul", { class: "parts" }, ...parts.map((p, i) => el("li", { class: i === 0 && !head ? "main" : null },
    el("a", { href: p.url, target: "_blank", class: i === 0 && !head ? "button primary" : null,
              onclick: ev => { ev.preventDefault(); if (openPart(p.url) && heldBack) { heldBack = null; render(); } } },
      i === 0 && !head ? `${p.title} openen` : p.title),
    p.login ? el("span", { class: "plogin" }, "Inloggen: " + p.login) : null)));
  return head ? el("div", {}, el("p", { class: "parts-head" }, head), list) : list;
}
const mainParts = env => [{ title: env.title, url: env.url, login: env.login }, ...(env.links || [])];

// BEGIN options
// The choices of an environment (1C6, 1C7): parts first, then data. A data
// set whose part is off is off too, and cannot be switched on.
const optName = o => (o.title || o.id).split(/ \(|: /)[0];
const optBlocked = (o, opts) => o.kind === "data" &&
  (o.needs || []).some(n => opts.some(p => p.id === n && !p.on));

// 1C7: "Aangepast: zonder Klantcontact, met …"; a data set that is off only
// because its part is off is not named again.
function customLine(env) {
  const opts = env.options || [];
  const without = opts.filter(o => !o.on && o.default !== false && !optBlocked(o, opts)).map(optName);
  const with_ = opts.filter(o => o.on && o.default === false).map(optName);
  if (!without.length && !with_.length) return null;
  const said = [without.length ? "zonder " + without.join(", ") : "", with_.length ? "met " + with_.join(", ") : ""];
  return el("p", { class: "custom" }, el("b", {}, "Aangepast: "), said.filter(Boolean).join("; "));
}

function optionsBlock(env) {
  const opts = env.options || [];
  if (!opts.length) return null;
  const row = o => {
    const blocked = optBlocked(o, opts);
    const box = el("input", { type: "checkbox", "data-opt": o.id, "data-needs": (o.needs || []).join(","),
                              disabled: blocked, onchange: ev => {
      // At once on the page: the data sets that need this part follow.
      if (o.kind === "part") {
        for (const d of ev.target.closest(".options").querySelectorAll("input[data-needs]")) {
          if (!d.dataset.needs.split(",").includes(o.id)) continue;
          d.disabled = !ev.target.checked;
          if (!ev.target.checked) d.checked = false;
          d.closest(".opt").classList.toggle("off", d.disabled);
        }
      }
      setOption(env, o, ev.target.checked);
    } });
    box.checked = !!o.on && !blocked;
    return el("label", { class: "opt" + (blocked ? " off" : "") }, box,
      el("span", {}, o.title || o.id, o.about ? el("small", {}, o.about) : null));
  };
  const parts = opts.filter(o => o.kind === "part"), data = opts.filter(o => o.kind !== "part");
  const both = parts.length && data.length;
  return el("details", { class: "options" }, el("summary", {}, "Aanpassen"),
    both ? el("p", { class: "opt-head" }, "Onderdelen") : null, ...parts.map(row),
    both ? el("p", { class: "opt-head" }, "Demodata") : null, ...data.map(row));
}
// END options

// The state line on the card: what phase it is in.
function stateLine(cls, text) {
  return el("div", { class: "state " + cls }, el("span", { class: "dot" }), text);
}

function failedText(env) {
  const e = env.error || "De start is afgebroken.";
  const p = env.progress;
  if (p && p.step && p.steps && !/^Bij stap /.test(e)) {
    return `Bij stap ${p.step} van ${p.steps}${p.label ? ` (${p.label})` : ""}: ${e}`;
  }
  return e;
}

function autoBlock(at, what) {
  return el("div", { class: "auto", "data-auto-at": at },
    el("span", { class: "auto-text", "data-what": what || "" }, ""),
    el("button", { onclick: cancelAuto }, "Niet automatisch starten"));
}

// One card. mode: "free" (nothing else active), "active" (this one runs),
// "grey" (another one runs: inert), "round" (the round is here: its phase,
// no buttons), "two" (two run: only Stoppen).
function card(env, mode) {
  const kids = [];
  const buttons = [];
  const btn = (text, verb, primary, disabled) =>
    buttons.push(el("button", { class: primary ? "primary" : null, disabled: !!disabled, onclick: () => act(verb, env) }, text));
  const ph = env.phase;
  const now = serverNow();

  if (ph === "unknown") {
    kids.push(stateLine("busy", "Even geduld…"));
  } else if (ph === "stopped") {
    // OVERZICHT (1C): only what is not in order is shown (rule 3).
    if (env.precondition) {
      kids.push(el("div", { class: "warn" }, el("p", {}, el("b", {}, "Kan niet draaien op deze computer.")), el("p", {}, env.precondition)));
    }
    if (env.ended) kids.push(el("div", { class: "warn" }, el("p", {}, env.ended.text)));
    if (env.autostart && !env.precondition) kids.push(autoBlock(env.autostart.at));
    // 1C6, 1C7: not on a grey card (another one runs) or one that cannot run.
    if (mode === "free" && !env.precondition) kids.push(customLine(env), optionsBlock(env));
    btn("Starten", "start", true, !!env.precondition);
  } else if (ph === "checking") {
    kids.push(stateLine("busy", "Bezig met controleren…"));
    btn("Stoppen", "stop");
  } else if (ph === "problem") {
    // PROBLEEM (P1–P5): one at a time. Without the runtime nothing else
    // can be checked, so then no counter.
    const probs = env.problems || [];
    const p = probs[0] || { text: "Er is een probleem.", kind: "problem" };
    const counted = p.code !== "runtime-down" && probs.length > 1;
    kids.push(stateLine("problem", counted ? `Probleem 1 van ${probs.length}` : "Probleem"));
    kids.push(el("div", { class: "bad" }, el("p", {}, p.text)));
    if (p.kind === "fixable") {
      kids.push(el("div", { class: "fixbox" }, el("p", {}, el("b", {}, "Launch kan dit voor je oplossen. "), p.fix || "")));
    }
    if (env.problem_note) {
      kids.push(el("p", { class: "note " + (env.problem_note === "Opgelost" ? "good" : "bad-note") }, env.problem_note));
    }
    const fixFirst = p.kind === "fixable" && env.problem_note !== "Opgelost";
    if (p.kind === "fixable") btn("Los het op voor mij", "fix", fixFirst);
    btn("Opnieuw proberen", "retry", !fixFirst);
    btn("Stoppen", "stop");
  } else if (ph === "fixing") {
    // OPLOSSEN (O1, O2): no buttons.
    kids.push(stateLine("busy", "Bezig met oplossen"));
    kids.push(el("div", { class: "bar waiting" }, el("div", {})));
    kids.push(el("p", { class: "muted" }, "Vraagt Windows om toestemming, klik dan op Ja; het venster kan achter de browser staan."));
  } else if (ph === "notice") {
    // MELDING (M1–M3).
    const n = env.notice || {};
    kids.push(stateLine("attention", "Eerst lezen"));
    kids.push(el("div", { class: "notice" + (n.level === "danger" ? " danger" : "") },
      el("b", {}, n.title || "Let op"), el("p", { class: "notice-text" }, n.text || "")));
    btn("Akkoord en starten", "accept", true);
    btn("Stoppen", "stop");
  } else if (ph === "starting") {
    // STARTEN (2A–2F).
    kids.push(stateLine("starting", "Wordt gestart…"));
    kids.push(progressBlock(env));
    btn("Stoppen", "stop");
  } else if (ph === "ready") {
    // KLAAR (3A–3D).
    kids.push(stateLine("ready", "Klaar"));
    if (env.not_answering_since) {
      kids.push(el("div", { class: "warn" }, el("p", { class: "since-text", "data-since": env.not_answering_since, "data-what": env.title }, "")));
    }
    if (env.unknown_since && now - env.unknown_since >= 60) {
      kids.push(el("div", { class: "warn" }, el("p", {}, "Docker antwoordt even niet.")));
    }
    if (heldBack === env.id) {
      kids.push(el("div", { class: "warn" }, el("p", {}, "Je browser hield het venster tegen. Klik op de knop hieronder, "
        + "of sta pop-ups toe voor deze pagina (het icoontje rechts in de adresbalk); dan gaat het de volgende keer vanzelf.")));
    }
    kids.push(partsList(mainParts(env)));
    btn("Stoppen", "stop");
  } else if (ph === "failed") {
    // MISLUKT (F1–F5).
    kids.push(stateLine("failed", "Starten mislukt"));
    kids.push(el("div", { class: "bad" }, el("p", {}, failedText(env))));
    kids.push(partsList(env.answering, "Deze onderdelen antwoorden"));
    if (env.log_tail) {
      kids.push(el("details", { class: "log" }, el("summary", {}, "Details tonen"), el("pre", {}, env.log_tail)));
    }
    btn("Opnieuw proberen", "start", true);
    btn("Stoppen", "stop");
  } else if (ph === "stopping") {
    // STOPPEN (S1, S2); when it did not work, Opnieuw proberen.
    if (env.stop_error) {
      kids.push(stateLine("failed", "Stoppen lukte niet"));
      kids.push(el("div", { class: "bad" }, el("p", {}, env.stop_error)));
      btn("Opnieuw proberen", "retry", true);
    } else {
      kids.push(stateLine("busy", "Wordt gestopt…"));
      kids.push(el("div", { class: "bar waiting" }, el("div", {})));
      kids.push(el("p", { class: "muted" }, "Alles wordt opgeruimd. De vensters van de omgeving blijven open."));
    }
  } else {
    kids.push(stateLine("busy", ph || "Even geduld…"));
  }

  if (mode === "round") kids.push(el("p", { class: "round-note" }, "Gestart door de rondgang."));
  let actions = buttons;
  if (mode === "round" || mode === "grey") actions = [];
  if (mode === "two") actions = buttons.filter(b => b.textContent === "Stoppen");
  if (mode === "two" && ph !== "stopping" && !actions.length) {
    actions = [el("button", { onclick: () => act("stop", env) }, "Stoppen")];
  }

  const section = el("section", { class: mode === "grey" ? "card blocked" : "card", "aria-label": env.title, "data-id": env.id, "data-phase": ph },
    el("div", { class: "head" },
      el("div", { class: "logo", "aria-hidden": "true" }, (env.title || "?").charAt(0)),
      el("div", {}, el("p", { class: "title" }, env.title), el("span", { class: "version" }, env.version || ""))),
    el("p", { class: "summary" }, env.summary || ""),
    licencesBlock(env),
    ...kids,
    actions.length ? el("div", { class: "actions" }, ...actions) : null);
  return mode === "grey" ? inert(section) : section;
}

// Grey means inert (#284): what the card is, nothing to do with it. Lists
// that unfold become a plain line, links plain text, buttons go.
function inert(section) {
  for (const d of [...section.querySelectorAll("details")]) {
    const s = d.querySelector("summary");
    d.replaceWith(el("p", { class: d.className + " folded" }, s ? s.textContent : ""));
  }
  for (const a of [...section.querySelectorAll("a")]) a.replaceWith(a.textContent);
  for (const b of [...section.querySelectorAll("button, .auto")]) b.remove();
  section.setAttribute("aria-disabled", "true");
  return section;
}

const ACTIVE = new Set(["checking", "problem", "fixing", "notice", "starting", "ready", "failed", "stopping"]);

// The round (#251, 1D and R1–R5).
const titleOf = id => ((S && S.envs.find(e => e.id === id)) || {}).title || id || "";
function cycleBox(c, anyActive) {
  if (!c || !c.available) return null;
  const kids = [];
  if (c.active) {
    kids.push(el("div", { class: "cycle-head" },
      el("b", {}, `Ronde ${c.round}`), " · ",
      el("span", { class: "cycle-now", "data-phase": c.phase || "", "data-until": c.until || "",
                   "data-env": titleOf(c.env), "data-next": titleOf(c.next) }, "")));
    if (c.last && c.last.length) kids.push(el("ul", { class: "cycle-last" }, ...c.last.slice(-3).map(l => el("li", {}, l))));
    kids.push(el("div", { class: "actions" }, el("button", { class: "primary", onclick: () => cycleAct("stop") }, "Rondgang stoppen")));
  } else {
    kids.push(el("div", { class: "cycle-head" }, el("b", {}, "Rondgang"), " · alle omgevingen om de beurt starten, 5 minuten laten draaien en weer stoppen: een test die vanzelf doorloopt."));
    if (c.autostart && !anyActive) kids.push(autoBlock(c.autostart.at, "De rondgang"));
    if (c.last && c.last.length) kids.push(el("ul", { class: "cycle-last" }, ...c.last.slice(-3).map(l => el("li", {}, l))));
    if (!anyActive) {
      const row = el("div", { class: "actions" }, el("button", { onclick: () => cycleAct("start") }, "Rondgang nu starten"));
      // A marker on the stick: the round begins at once at the next start-up too.
      if (c.can_persist) row.append(el("button", { onclick: () => cycleAct(c.persisted ? "persist-off" : "persist-on") },
        c.persisted ? "Na herstart meteen verder: aan (uitzetten)" : "Na herstart meteen verder: uit (aanzetten)"));
      kids.push(row);
    }
  }
  const box = el("section", { class: "cycle" + (c.active ? " active" : "") + (!c.active && anyActive ? " blocked" : "") }, ...kids);
  return !c.active && anyActive ? inert(box) : box;
}

function render() {
  const grid = document.getElementById("grid");
  const top = document.getElementById("top");
  const cyc = document.getElementById("cycle");
  top.replaceChildren(...[
    topMessage ? el("div", { class: "topmsg", role: "alert" }, el("span", {}, topMessage),
      el("button", { onclick: () => { topMessage = ""; render(); } }, "Sluiten")) : null,
    S && S.two_active ? el("div", { class: "twoactive", role: "status" }, "Er draaien twee omgevingen. Stop er één.") : null].filter(Boolean));
  if (!S) { tick(); return; }
  // Keep opened lists (licences, details) open across a redraw. The key:
  // card, class, parent and the summary's first word (the licence block has
  // two sub-lists with the same class).
  const key = d => [d.closest(".card")?.getAttribute("aria-label"), d.className, d.parentElement.className,
                    (d.querySelector("summary")?.textContent || "").split(" ")[0]].join("|");
  const opened = new Set([...grid.querySelectorAll("details[open]")].map(key));
  const c = S.cycle || {};
  const active = S.envs.filter(e => ACTIVE.has(e.phase));
  const modeOf = e => {
    if (c.active) return e.cycle_here ? "round" : "grey";
    if (S.two_active) return ACTIVE.has(e.phase) ? "two" : "grey";
    if (active.length) return active.includes(e) ? "active" : "grey";
    return "free";
  };
  cyc.replaceChildren(...[cycleBox(c, active.length > 0)].filter(Boolean));
  // A choice just clicked keeps the keyboard focus across the redraw.
  const f = document.activeElement;
  const focusOpt = f && f.dataset && f.dataset.opt ? [f.closest(".card")?.dataset.id, f.dataset.opt] : null;
  grid.replaceChildren(...(S.envs.length ? S.envs.map(e => card(e, modeOf(e))) : [el("p", {}, "Er zijn geen omgevingen.")]));
  for (const d of grid.querySelectorAll("details")) if (opened.has(key(d))) d.open = true;
  if (focusOpt) grid.querySelector(`.card[data-id="${focusOpt[0]}"] input[data-opt="${focusOpt[1]}"]`)?.focus();
  tick();
}

// Contract G: the tab that pressed Starten opens the main part once, when
// the environment is ready; the round and other tabs open nothing.
function autoOpen() {
  let id = null;
  try { id = sessionStorage.getItem(OPEN_KEY); } catch (e) { return; }
  if (!id || !S) return;
  const env = S.envs.find(e => e.id === id);
  if (!env || env.phase === "stopped") { try { sessionStorage.removeItem(OPEN_KEY); } catch (e) {} return; }
  if (env.phase === "ready" && !(S.cycle && S.cycle.active)) {
    try { sessionStorage.removeItem(OPEN_KEY); } catch (e) {}
    // Not from a click, so a pop-up blocker may hold it back: then say so.
    if (!openPart(env.url)) { heldBack = env.id; render(); }
  }
}

function tick() {
  const now = serverNow(), local = nowLocal();
  // GEEN LAUNCHER (§3.12) after 10 s without an answer; LADEN (§3.13) only
  // when the first answer takes longer than 1 s.
  const since = lastAnswer || pageLoaded;
  const dead = local - since >= 10;
  const off = document.getElementById("offline");
  off.hidden = !dead;
  if (dead) off.textContent = `De Launcher antwoordt niet sinds ${clock(since)}. Start de Launcher opnieuw.`;
  document.body.classList.toggle("dead", dead);
  if (dead && overlay) { hideOverlay(); }
  const grid = document.getElementById("grid");
  if (!S && !dead && local - pageLoaded >= 1 && !grid.childElementCount) grid.append(el("p", { class: "loading" }, "Even geduld…"));
  if (!S && dead) grid.replaceChildren();
  // An overlay whose answer never changes the state does not stay forever.
  if (overlay && local - overlay.at > 30) { hideOverlay(); }

  for (const box of document.querySelectorAll(".auto[data-auto-at]")) {
    const left = Math.max(0, Math.ceil(+box.dataset.autoAt - now));
    const t = box.querySelector(".auto-text"), what = t.dataset.what;
    t.textContent = what
      ? (left > 0 ? `${what} start automatisch over ${dur(left)}` : `${what} wordt nu gestart…`)
      : (left > 0 ? `Start automatisch over ${dur(left)}` : "Wordt nu automatisch gestart…");
  }
  for (const p of document.querySelectorAll(".since-text[data-since]")) {
    p.textContent = `${p.dataset.what} antwoordt al ${dur(now - +p.dataset.since)} niet.`;
  }
  for (const box of document.querySelectorAll(".progress[data-started]")) {
    const step = +box.dataset.step, steps = +box.dataset.steps, exp = +box.dataset.expected;
    const elapsed = now - +box.dataset.started;
    const frac = exp ? Math.min(elapsed / exp, 0.97) : 0;
    const overall = Math.min(1, (step - 1 + frac) / steps);
    const ob = box.querySelector(".bar.overall"), sb = box.querySelector(".bar.step");
    ob.firstChild.style.width = (overall * 100).toFixed(1) + "%";
    ob.setAttribute("aria-valuenow", Math.round(overall * 100));
    if (exp) sb.firstChild.style.width = (frac * 100).toFixed(1) + "%";
    const pt = progressTexts(elapsed, exp, box.dataset.rest, now);
    let t = pt.time;
    const act = +box.dataset.activity, started = +box.dataset.started;
    if (act && act >= started - 5) t += ` · laatste activiteit ${dur(now - act)} geleden`;
    box.querySelector(".ptime").textContent = t;
    if (box.dataset.since) box.querySelector(".psince").textContent = "bezig sinds " + dur(now - +box.dataset.since);
    box.querySelector(".peta").textContent = pt.eta || "";
  }
  const s = document.querySelector(".cycle-now");
  if (s) {
    const left = s.dataset.until ? Math.max(0, Math.ceil(+s.dataset.until - now)) : 0;
    const env = s.dataset.env, next = s.dataset.next;
    const t = {
      pause: `${env} start over ${dur(left)}`,
      starting: `${env} wordt gestart`,
      up: `${env} is klaar, nog ${dur(left)}`,
      stopping: `${env} wordt gestopt`,
    }[s.dataset.phase] || "";
    s.textContent = t + (next && next !== env ? ` · daarna ${next}` : "");
  }
}
setInterval(tick, 1000);

let polling = false;
async function refresh() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("status " + r.status);
    const data = await r.json();
    lastAnswer = nowLocal();
    if (typeof data.now === "number") skew = data.now - lastAnswer;
    const changed = !S || S.seq !== data.seq || document.body.classList.contains("dead");
    S = data;
    if (overlay && overlay.seq !== data.seq) { hideOverlay(); }
    if (changed) {
      // What went wrong goes once the page has moved on (not at once: a 409
      // often comes with another tab's change).
      if (topMessage && lastAnswer - topMessageAt > 5) topMessage = "";
      render();
      autoOpen();
    } else {
      // Same seq: only what the start does right now changes (2E), in place,
      // so a button is not replaced under the pointer.
      for (const env of data.envs) {
        const box = env.progress && document.querySelector(`.progress[data-id="${env.id}"]`);
        if (box) setDetail(box, env.progress);
      }
      tick();
    }
  } catch (e) {
    tick();   // GEEN LAUNCHER after 10 s
  } finally {
    polling = false;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
